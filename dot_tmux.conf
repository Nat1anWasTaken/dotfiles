# Ghostty-style navigation using the tmux prefix (Ctrl+B).
set -g mouse on
# Recognize a standalone Escape promptly while allowing terminal key sequences.
set -sg escape-time 25

# Always emit the terminal interrupt byte (0x03) to the focused pane, rather
# than relying on tmux's implicit root-table passthrough.
bind-key -n C-c send-keys -H 03

# Ctrl+C cancels scrollback selection as well as interrupting programs.
bind-key -T copy-mode C-c send-keys -X cancel
bind-key -T copy-mode-vi C-c send-keys -X cancel

# Navigate between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Advertise 256-color support inside tmux and preserve Ghostty truecolor over SSH.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"

# Codex uses enhanced keyboard input. Enable tmux's CSI-u extended-key
# forwarding and advertise the capability to Ghostty clients.
set -g extended-keys on
set -as terminal-features ",xterm-ghostty:extkeys"

# Copy mouse selections without leaving scrollback.
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Ctrl+B, then Space opens the current layout; Space/arrows preview, Enter keeps it, Esc restores.
# Column variants keep equal widths, with the larger tiles on the named side.
bind Space run-shell -C 'display-popup -E -w 48 -h 9 -T "Pane layout" python3 "$HOME/.tmux/layout-menu.py" "#{window_id}" "#{@cycle-layout}"'

# Keep the default green bar and darken it while waiting for a prefix command.
set -g status-style 'fg=#{?client_prefix,colour255,black},bg=#{?#{==:#{client_key_table},pane-close},#cf3030,#{?client_prefix,colour22,green}}'

# Make the active window stand out from the status bar.
set -g window-status-current-style 'fg=colour255,bg=colour31,bold'
set -g window-status-current-format ' #I:#W#{window_flags} #{?#{==:#{client_key_table},pane-close},#[fg=white bg=#cf3030 bold] Close? ,}'

# Make the active terminal pane easy to distinguish at a glance.
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=#{?#{==:#{client_key_table},pane-close},#cf3030,colour39},bold'
set -g pane-border-lines heavy
set -g window-style 'fg=colour244,bg=colour233,dim'
set -g window-active-style 'fg=terminal,bg=terminal,nodim,bright'

# Preserve the focused pane's local directory. When it is running SSH, reconnect
# to the same host and start in the remote directory reported by OSC 7 or PS1.
bind d run-shell '$HOME/.tmux/plugins/tmux-ssh-split/scripts/tmux-ssh-split.sh --keep-remote-cwd --strip-cmd -c "#{pane_current_path}" -h' \; select-layout -E
bind D run-shell '$HOME/.tmux/plugins/tmux-ssh-split/scripts/tmux-ssh-split.sh --keep-remote-cwd --strip-cmd -c "#{pane_current_path}" -v' \; select-layout -E
bind c run-shell '$HOME/.tmux/plugins/tmux-ssh-split/scripts/tmux-ssh-split.sh --keep-remote-cwd --strip-cmd -c "#{pane_current_path}" --window'
bind t run-shell '$HOME/.tmux/plugins/tmux-ssh-split/scripts/tmux-ssh-split.sh --keep-remote-cwd --strip-cmd -c "#{pane_current_path}" --window'
bind % run-shell '$HOME/.tmux/plugins/tmux-ssh-split/scripts/tmux-ssh-split.sh --keep-remote-cwd --strip-cmd -c "#{pane_current_path}" -h'
bind '"' run-shell '$HOME/.tmux/plugins/tmux-ssh-split/scripts/tmux-ssh-split.sh --keep-remote-cwd --strip-cmd -c "#{pane_current_path}" -v'

# Ctrl+B, then Ctrl+D detaches (d is now split-right).
bind C-d detach-client

# Native tmux commands keep confirmation instant, with no shell or Python startup.
# The temporary key table is the state: after Escape, normal key handling resumes.
# A red status bar and label keep the warning visible in zoomed/single-pane windows.
bind w if-shell -F "#{&&:#{m/r:^(sh|bash|zsh|fish|ksh|dash|ash|nu)$,#{pane_current_command}},#{==:#{pane_start_command},}}" {
    kill-pane
} {
    switch-client -T pane-close
    refresh-client
}
bind -T pane-close w kill-pane
bind -T pane-close Escape {
    switch-client -T root
    refresh-client
}
set-hook -g after-select-pane {
    if-shell -F "#{==:#{client_key_table},pane-close}" { switch-client -T root ; refresh-client }
}
set-hook -g after-select-window {
    if-shell -F "#{==:#{client_key_table},pane-close}" { switch-client -T root ; refresh-client }
}
set-hook -g session-window-changed {
    if-shell -F "#{==:#{client_key_table},pane-close}" { switch-client -T root ; refresh-client }
}
set-hook -g client-session-changed {
    if-shell -F "#{==:#{client_key_table},pane-close}" { switch-client -T root ; refresh-client }
}

# Ctrl+B, then Shift+Q closes the current session after confirmation.
bind Q confirm-before -p "Kill session #S? (y/n)" kill-session

# Ctrl+B, then r prompts to rename the current window.
bind r command-prompt -I '#W' { rename-window '%%' }

# Ctrl+B, then Shift+R prompts to rename the current session.
bind R command-prompt -I '#S' { rename-session '%%' }
