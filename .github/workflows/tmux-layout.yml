name: tmux-layout

on:
  push:
    tags: ["tmux-layout-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, asset: tmux-layout-darwin-arm64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, asset: tmux-layout-darwin-amd64 }
          - { runner: ubuntu-26.04, target: x86_64-unknown-linux-musl, asset: tmux-layout-linux-amd64 }
          - { runner: ubuntu-26.04-arm, target: aarch64-unknown-linux-musl, asset: tmux-layout-linux-arm64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: tmux-layout
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/tmux-layout ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: tmux-layout/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "tmux layout picker binaries."
        env:
          GH_TOKEN: ${{ github.token }}
